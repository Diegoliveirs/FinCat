# Instale em /etc/nginx/sites-available/fincat.conf e habilite-o com um link em sites-enabled.
# O certificado deve ser obtido antes com certbot para ambos os domínios.
server {
  listen 80;
  server_name fincat-app.duckdns.org fincat-staging.duckdns.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name fincat-app.duckdns.org;
  ssl_certificate /etc/letsencrypt/live/fincat-app.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fincat-app.duckdns.org/privkey.pem;

  location / {
    proxy_pass http://fincat_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name fincat-staging.duckdns.org;
  ssl_certificate /etc/letsencrypt/live/fincat-app.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fincat-app.duckdns.org/privkey.pem;
  auth_basic "FinCat staging";
  auth_basic_user_file /etc/nginx/fincat-staging.htpasswd;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
